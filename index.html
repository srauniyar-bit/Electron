<!DOCTYPE html>
<html lang="en">
    <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width", initial-scale="1.0">
<title> THE ELECTRON | Physics</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap')
    :root {
        --bg-color: #0b0c10;
        --text-main: #c5c6c7;
        --accent-1: #66fcf1;  /* color change*/
    
        --accent-2: #45a29e; /* color change*/
        --card-bg: #1f2833;

    }
    *{
        margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    
    
    }
body{
        background-color: var(--bg-color);
color: var(--text-main);
overflow: hidden;

}

/* Dynamic Electrons*/
#particle-canvas{
   position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
z-index: -1;
opacity: 0.4;


}
/* scroll animation*/
.reveal{
opacity: 0;
transform: all 0.8s ease-out;
}
.reveal.active{
opacity: 1;
transform: translateY(0);
}
/* header hero section*/
header {
height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
position: relative;
}

h1{
font-size: 5rem;
color: var(--accent-1);
text-shadow: 0 0 20px var(--accent-2);
margin-bottom: 20px;
letter-spacing: 2px;
}

p-subtitle {
font-size: 1.5rem;
max-width: 800px;
margin: 0 auto;
}

/*css atom animation*/
.atom {
position: relative;
width: 200px;
height: 200px;
margin: 40px auto;
}
.nucleus{
position:absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: 30px;
height: 30px;
background: var(--accent-2);
border-radius: 50%;
box-shadow: 0 0 30px var(--accent-2);
}
.orbit {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
border: 2px dashed rgba(102, 252, 241, 0.3);
border-radius: 50%;
animation: spin 4s linear infinite;
}
.orbit:nth-child(2) { animation-duration: 6s; animation-direction: reverse; transform: rotateX(60deg) rotateY(45deg); }
        .orbit:nth-child(3) { animation-duration: 8s; transform: rotateX(45deg) rotateY(60deg); }

.electron-dot{
position: absolute;
top: -6px; left: 50%;
width: 12px; height: 12px;
background: var(--accent-1);
border-radius: 50%;
    box-shadow: 0 0 15px var(--accent-1);
}
 
@keyframes spin { 100% { transform: rotate(360deg);}}

/*section*/
section {
padding : 100px 10%;

}

h2{
font-size: 3rem;
color: var(--accent-1);






}












    </style>

    </head>
</html>
